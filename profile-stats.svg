<svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity statistics for Ihthos</title><desc id="desc">Contribution, active-day, language, and years-active counts.</desc>
  <style>
    .frame { fill:#0d1117; stroke:#30363d; stroke-width:2; } .eyebrow { fill:#8b949e; font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:1px; }
    .heading { fill:#f0f6fc; font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace; } .stat { fill:#161b22; stroke:#30363d; }
    .number { fill:#f0f6fc; font:700 25px ui-monospace,SFMono-Regular,Menlo,monospace; } .label { fill:#8b949e; font:13px ui-monospace,SFMono-Regular,Menlo,monospace; }
  </style>
  <rect class="frame" x="1" y="1" width="818" height="168" rx="14"/><text x="22" y="27" class="eyebrow">PROFILE SNAPSHOT</text><text x="22" y="47" class="heading">A snapshot of the public work</text><g transform="translate(22 54)"><rect class="stat" width="178" height="92" rx="12"/><text x="18" y="35" class="number">418</text><text x="18" y="63" class="label">Contributions</text></g><g transform="translate(219 54)"><rect class="stat" width="178" height="92" rx="12"/><text x="18" y="35" class="number">52</text><text x="18" y="63" class="label">Active Days</text></g><g transform="translate(416 54)"><rect class="stat" width="178" height="92" rx="12"/><text x="18" y="35" class="number">6</text><text x="18" y="63" class="label">Languages</text></g><g transform="translate(613 54)"><rect class="stat" width="178" height="92" rx="12"/><text x="18" y="35" class="number">3</text><text x="18" y="63" class="label">Years Active</text></g>
</svg>
