name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch contribution calendar and render SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/profile_art.py
      - name: Commit refreshed contribution art
        run: |
          if git diff --quiet -- data/contributions.json contrib-heatmap.svg profile-stats.svg language-card.svg tech-stack-dark.svg; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg profile-stats.svg language-card.svg tech-stack-dark.svg
          git commit -m "chore: refresh contribution graph [skip ci]"
          git push
