    .lang { fill:#f0f6fc; font:13px ui-monospace,SFMono-Regular,Menlo,monospace; } .percent { fill:#8b949e; font:13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .ring { transform:rotate(-90deg); transform-origin:59px 59px; }
